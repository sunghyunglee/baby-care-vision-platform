{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영상 위험 분석</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, "Malgun Gothic", sans-serif;
      color: #18352a;
      background: #eff6ee;
      --muted: #486156;
      --line: #cdded2;
      --green: #245940;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, p { margin: 0; }
    main { width: min(100% - 2rem, 65rem); margin-inline: auto; padding-block: clamp(2.75rem, 8vw, 6rem); }
    .heading { margin-bottom: clamp(1.75rem, 5vw, 3rem); }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; letter-spacing: -.05em; }
    h2 { font-size: 1.2rem; letter-spacing: -.025em; }
    .heading p, .card > p { margin-top: .55rem; color: var(--muted); line-height: 1.6; }

    .workspace {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 1.25rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: clamp(1.2rem, 3.5vw, 2rem);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 6px 22px #254a3610;
    }

    .upload-form, .result-panel { margin-top: 1.4rem; }
    .file-field {
      display: grid;
      gap: .65rem;
      padding: 1.25rem;
      border: 1px dashed #9dbbaa;
      border-radius: .8rem;
      background: #f5faf5;
    }

    .file-field label { font-weight: 700; }
    #video-input {
      width: 100%;
      min-width: 0;
      border-radius: .4rem;
      font: inherit;
      font-size: .9rem;
      color: var(--muted);
    }

    #video-input::file-selector-button {
      margin-inline-end: .65rem;
      padding: .52rem .75rem;
      border: 1px solid var(--line);
      border-radius: .45rem;
      background: #fff;
      color: #18352a;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #video-input::file-selector-button:hover { background: #e9f4eb; }
    #analyze-button {
      width: 100%;
      min-height: 2.9rem;
      margin-top: 1rem;
      padding: .7rem 1rem;
      border: 0;
      border-radius: .65rem;
      color: white;
      background: var(--green);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    #analyze-button:hover:not(:disabled) { background: #1a4733; }
    #analyze-button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #367d58; outline-offset: 3px; }

    .result-panel {
      --state-bg: #f1f5f2;
      --state-border: #d3e0d6;
      --state-text: #365247;
      display: grid;
      flex: 1;
      align-content: center;
      justify-items: center;
      gap: .65rem;
      min-height: 9rem;
      padding: 1.2rem;
      border: 1px solid var(--state-border);
      border-radius: .8rem;
      color: var(--state-text);
      background: var(--state-bg);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .result-panel[data-state="loading"] {
      --state-bg: #eef4fa;
      --state-border: #ccdceb;
      --state-text: #285174;
    }

    .result-panel[data-state="safe"] {
      --state-bg: #e5f5e9;
      --state-border: #a5cfb1;
      --state-text: #1b5a35;
    }

    .result-panel[data-state="danger"] {
      --state-bg: #fcecec;
      --state-border: #edbfbf;
      --state-text: #8f2d36;
    }

    .result-panel[data-state="error"] {
      --state-bg: #fff5e5;
      --state-border: #e7d3ac;
      --state-text: #704914;
    }

    .result-label { display: inline-flex; align-items: center; gap: .55em; font-size: 1.15rem; }
    .result-label::before {
      content: "";
      width: .55em;
      height: .55em;
      border-radius: 50%;
      background: currentColor;
    }

    .result-message { font-size: .9rem; line-height: 1.55; }
    .result-message:empty { display: none; }

    @media (max-width: 44rem) {
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
  <script src="{% static 'js/analysis.js' %}" defer></script>
</head>
<body>
  <main>
    <header class="heading">
      <h1>영상 위험 분석</h1>
      <p>영상을 선택해 위험 감지 여부를 확인하세요.</p>
    </header>

    <div class="workspace">
      <section class="card" aria-labelledby="upload-heading">
        <h2 id="upload-heading">영상 업로드</h2>
        <p>분석할 영상 파일을 하나 선택하세요.</p>
        <form class="upload-form" action="/api/v1/analyses/" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="file-field">
            <label for="video-input">영상 파일</label>
            <input id="video-input" name="video" type="file" accept="video/*">
          </div>
          <button id="analyze-button" type="button">분석</button>
        </form>
      </section>

      <section class="card" aria-labelledby="result-heading">
        <h2 id="result-heading">AI 분석 결과</h2>
        <!-- Front 2 updates this panel only: waiting / loading / safe / danger / error.
             Set data-state and replace the label/message as text for each response. -->
        <div id="result" class="result-panel" data-state="waiting" role="status" aria-atomic="true">
          <strong class="result-label" data-result-label>분석 대기</strong>
          <p class="result-message" data-result-message>분석을 시작하면 여기에 결과가 표시됩니다.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
